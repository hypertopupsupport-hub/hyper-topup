<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYPER TOPUP | إعدادات الحساب</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }
    body {
      background-color: #080d1a;
      color: #ffffff;
      padding: 15px 15px 90px;
      direction: rtl;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* الهيدر العلوي */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      padding: 5px 0;
    }
    .back-btn {
      color: #f5c85b;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
      background: rgba(244, 201, 93, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(244, 201, 93, 0.2);
    }
    .header-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
    }

    /* كارت الإعدادات */
    .settings-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(244, 201, 93, 0.25);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(2, 4, 9, 0.6);
      border: 1px solid rgba(244, 201, 93, 0.2);
      border-radius: 10px;
      color: #f5c85b;
      font-size: 14px;
      font-weight: 600;
      text-align: right;
    }
    .form-input[readonly] {
      opacity: 0.85;
      cursor: not-allowed;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    .btn-change-pass {
      background: transparent;
      border: 1px solid #f5c85b;
      color: #f5c85b;
    }
    .btn-change-pass:active {
      background: rgba(244, 201, 93, 0.15);
    }

    /* رسالة عدم تسجيل الدخول */
    .not-logged-box {
      text-align: center;
      padding: 30px 15px;
    }
    .not-logged-box p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .btn-login-redirect {
      display: inline-block;
      background: #f5c85b;
      color: #000;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; height: 73px;
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, 1fr); direction: rtl;
      background: rgba(2, 4, 9, .94); border-top: 1px solid rgba(244, 201, 93, .13);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    @media (min-width: 600px) {
      .bottom-nav { left: 50%; right: auto; width: min(100%, 520px); transform: translateX(-50%); border-radius: 20px 20px 0 0; }
    }
    .nav-item {
      text-decoration: none; color: #70798b; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; font-size: 9px; font-weight: 700;
    }
    .nav-item.active { color: #f5c85b; text-shadow: 0 0 10px rgba(244, 201, 93, .45); }
    .nav-icon-svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; opacity: 0.7; }
    .nav-item.active .nav-icon-svg { opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    <!-- الهيدر -->
    <div class="header">
      <a href="account.html" class="back-btn">›</a>
      <h1 class="header-title">إعدادات الحساب</h1>
      <div style="width: 36px;"></div>
    </div>

    <!-- كارت البيانات -->
    <div class="settings-card" id="settingsContainer">
      <!-- سيتم تحميل البيانات هنا ديناميكياً -->
    </div>
  </div>

  <!-- الشريط السفلي -->
  <nav class="bottom-nav">
    <a class="nav-item" href="HYPER_TOPUP_REVIEWS_PRO_FINAL-1.html">
      <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>الرئيسية</span>
    </a>
    <a class="nav-item" href="all-products.html">
      <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>المنتجات</span>
    </a>
    <a class="nav-item active" href="account.html">
      <svg class="nav-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
      <span>الحساب</span>
    </a>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('settingsContainer');

      // فحص بيانات الحساب المخزنة في المتصفح
      const savedUser = JSON.parse(localStorage.getItem('hyper_user') || 'null');
      const savedEmail = localStorage.getItem('hyper_user_email');
      const savedName = localStorage.getItem('hyper_user_name');

      const name = (savedUser && savedUser.name) || savedName;
      const email = (savedUser && savedUser.email) || savedEmail;

      // لو الحساب غير مسجل خروج وهناك بيانات للمستخدم
      if (name || email) {
        container.innerHTML = `
          <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" class="form-input" value="${name || 'غير محدد'}" readonly>
          </div>

          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" class="form-input" value="${email || 'غير محدد'}" readonly>
          </div>

          <button class="action-btn btn-change-pass" onclick="alert('خاصية تغيير كلمة السر ستكون متاحة قريباً')">تغيير كلمة السر</button>
        `;
      } else {
        // لو الحساب عامل تسجيل خروج
        container.innerHTML = `
          <div class="not-logged-box">
            <p>أنت غير مسجل الدخول حالياً 🔒</p>
            <a href="account.html" class="btn-login-redirect">تسجيل الدخول / حساب جديد</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
