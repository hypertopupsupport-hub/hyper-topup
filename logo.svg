<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151922" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Neon Orange Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="50%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#cc3300" />
    </linearGradient>

    <!-- Inner Shield Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Gaming Circular Base -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="8" filter="url(#neonGlow)" />
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ff6600" stroke-width="2" stroke-dasharray="12 12" opacity="0.6" />

  <!-- Premium Crown on Top -->
  <path d="M 206 120 L 226 150 L 256 110 L 286 150 L 306 120 L 296 170 L 216 170 Z" fill="url(#neonGrad)" filter="url(#neonGlow)" />
  <circle cx="206" cy="112" r="5" fill="#ffffff" />
  <circle cx="256" cy="102" r="6" fill="#ffffff" />
  <circle cx="306" cy="112" r="5" fill="#ffffff" />

  <!-- Shield Shape -->
  <path d="M 156 180 L 356 180 L 356 290 C 356 360 256 410 256 410 C 256 410 156 360 156 290 Z" fill="#0b0e14" stroke="url(#neonGrad)" stroke-width="6" filter="url(#neonGlow)" />

  <!-- Stylized letter 'H' (HYPER) -->
  <!-- Left Pillar -->
  <path d="M 196 210 L 226 210 L 226 340 L 196 340 Z" fill="url(#neonGrad)" />
  <!-- Right Pillar -->
  <path d="M 286 210 L 316 210 L 316 340 L 286 340 Z" fill="url(#neonGrad)" />
  <!-- Middle Bar with Lightning Angle -->
  <path d="M 226 260 L 286 250 L 286 280 L 226 290 Z" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Sub Text: HYPER TOPUP -->
  <text x="256" y="445" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="4">HYPER TOPUP</text>
</svg>