<head>

  <title>HYPER TOPUP | قسم الألعاب</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap');

    :root {
      --bg: #080c18;
      --bg2: #10172a;
      --gold: #f4c95d;
      --white: #fff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg); color: var(--white); padding: 15px; }

    /* الهيدر والعنوان */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      color: var(--gold);
      text-decoration: none;
      font-weight: bold;
      font-size: 22px;
    }

    h1.page-title {
      font-size: 18px;
      color: var(--white);
      text-align: center;
      flex-grow: 1;
    }

    /* التبويبات الفلترة زي Midasbuy */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: var(--bg2);
      border: 1px solid rgba(244, 201, 93, 0.2);
      color: #aeb7c8;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
      font-weight: bold;
    }

    /* شبكة الألعاب */
    .games-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}
    .game-card {
      text-decoration: none;
      background: var(--bg2);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(244, 201, 93, 0.2);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .game-card:active { transform: scale(0.96); }

    .card-thumb {
      position: relative;
      width: 100%;
      height: 105px;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 3px 0;
      font-size: 9px;
      text-align: center;
      font-weight: bold;
      color: #000;
    }

    .badge.yellow { background: var(--gold); }

    .game-info {
      padding: 8px 4px;
      text-align: center;
    }

    .game-info h3 {
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
   .filter-tabs {
  display: flex;

}

}
/* إلغاء تأخير الضغط وتفعيل الضغطة المباشرة الواحدة على الموبايل */
a, button, .card, .game-card, .nav-item {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
