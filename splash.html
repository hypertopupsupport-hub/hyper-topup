
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050508">
  <title>HYPER TOPUP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at center,
          #10213b 0%, #080b14 48%, #030407 100%);
      color: white;
      font-family: Arial, sans-serif;
    }

    .intro {
      text-align: center;
      animation: appear 1s ease-out both;
    }

    .logo-wrap {
      width: 180px;
      height: 180px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      animation: float 2s ease-in-out infinite,
                 glow 2s ease-in-out infinite alternate;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 3px;
      font-weight: 800;
      text-shadow: 0 0 18px #168dff80;
    }

    .line {
      width: 110px;
      height: 3px;
      margin: 20px auto;
      border-radius: 10px;
      background: linear-gradient(90deg, #168dff, #f5c451);
      animation: line-in 1.2s ease-out both;
    }

    p {
      color: #aebbd0;
      font-size: 13px;
      letter-spacing: 1px;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.88); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 8px #168dff55); }
      to {
        filter:
          drop-shadow(0 0 24px #168dff99)
          drop-shadow(0 0 12px #f5c45144);
      }
    }

    @keyframes line-in {
      from { width: 0; opacity: 0; }
      to { width: 110px; opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="intro">
    <div class="logo-wrap">
      <img class="logo"
           src="./hyper_topup_logo_transparent.png"
           alt="HYPER TOPUP">
    </div>

    <h1>HYPER TOPUP</h1>
    <div class="line"></div>
    <p>YOUR DIGITAL WORLD</p>
  </main>
</body>
</html>
