<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYPER TOPUP - شحن عملات Sugo</title>
  <style>
    /* Global Styles & Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: #050508;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Modal Overlay Container */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 8, 0.95);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 15px;
    }

    .modal-container {
      width: 100%;
      max-width: 480px;
      background: #0b0814;
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
      margin: auto 0;
    }

    /* Header Layout */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .back-btn:active {
      transform: scale(0.9);
      background: #a855f7;
      color: #ffffff;
      box-shadow: 0 0 15px #a855f7;
    }

    .header-titles {
      text-align: left;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
    }

    .sub-badge {
      font-size: 11px;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 2px;
      border: 1px solid rgba(168, 85, 247, 0.25);
    }

    /* Hero Banner Image */
    .hero-banner {
      width: 100%;
      max-height: 130px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.2);
    }

    .hero-banner img {
      width: 100%;
      height: 130px;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* Products Grid Layout */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Individual Product Card */
    .product-card {
      background: #120b22;
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
    }

    .product-card:hover, .product-card:active {
      border-color: #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      transform: translateY(-2px);
    }

    /* Custom Unique Card Image Container */
    .sugo-card-img-wrapper {
      width: 100%;
      height: 100px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
      background: #000;
      border: 1px solid rgba(168, 85, 247, 0.15);
    }

    .sugo-card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Package Title & Price */
    .pkg-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .pkg-price {
      font-size: 13px;
      font-weight: 800;
      color: #c084fc;
      margin-bottom: 8px;
      text-shadow: 0 0 5px rgba(168, 85, 247, 0.4);
    }

    /* Action Charge Button */
    .charge-btn {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: 1px solid #a855f7;
      color: #c084fc;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .charge-btn:active {
      background: #a855f7;
      color: #ffffff;
      box-shadow: 0 0 12px #a855f7;
    }
  </style>
</head>
<body>

        <!-- Package 4 -->
        <div class="product-card">

          <div class="pkg-title">باقة 150,000 عملة</div>

          <button class="charge-btn" onclick="orderCoins('باقة 150,000 عملة', '1,650 ج.م')">شحن فوري</button>
        </div>

        <!-- Package 6 -->
        <div class="product-card">
          <div class="sugo-card-img-wrapper">
            <img src="https://i.ibb.co/SwHTZkzK/50a569607715b7a1e2785d2ec03cc926.png" alt="260,000 عملة" loading="lazy">
          </div>
          <div class="pkg-title">باقة 260,000 عملة</div>
          <div class="pkg-price">2,750 ج.م</div>
          <button class="charge-btn" onclick="orderCoins('باقة 260,000 عملة', '2,750 ج.م')">شحن فوري</button>
        </div>

        <!-- Package 7 -->
        <div class="product-card">
          <div class="sugo-card-img-wrapper">
            <img src="https://i.ibb.co/CsK9fW7g/d7d1e5e8eb01cf7880d86d53b00f531b.png" alt="520,000 عملة" loading="lazy">
          </div>
          <div class="pkg-title">باقة 520,000 عملة</div>

          <button class="charge-btn" onclick="orderCoins('باقة 520,000 عملة', '5,450 ج.م')">شحن فوري</button>
        </div>

      </div>

    </div>
  </div>

  <script>
    // Navigation Function
    function closeModal() {
      window.location.href = "apps.html";
    }

    // Direct WhatsApp Order Handler
    function orderCoins(pkgName, price) {
      const phone = "201002722164";
      const message = encodeURIComponent(`مرحباً، أريد شحن عملات تطبيق Sugo:\nالباقة: ${pkgName}\nالسعر: ${price}\nمن متجر HYPER TOPUP`);
      window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${message}`, '_blank');
    }
  </script>
</body>
</html>
