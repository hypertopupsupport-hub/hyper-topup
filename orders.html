<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYPER TOPUP | سجل الطلبات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }
    body {
      background-color: #080d1a;
      color: #ffffff;
      padding: 15px 15px 90px;
      direction: rtl;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* الهيدر العلوي */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 5px 0;
    }
    .back-btn {
      color: #f5c85b;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
      background: rgba(244, 201, 93, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(244, 201, 93, 0.2);
    }
    .header-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
    }

    /* أزرار التصفية / التبويبات */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .tab-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: #f5c85b;
      color: #000;
      border-color: #f5c85b;
    }

    /* قائمة كروت الطلبات */
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .history-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(244, 201, 93, 0.2);
      border-radius: 14px;
      padding: 14px;
      transition: all 0.3s ease;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .history-order-id {
      font-size: 13px;
      font-weight: bold;
      color: #f5c85b;
    }
    .history-date {
      font-size: 11px;
      color: #64748b;
    }
    .history-row {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 4px;
    }
    .history-status-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: bold;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .history-status-badge.completed {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.3);
    }
    .history-status-badge.cancelled {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.3);
    }

    .toggle-arrow {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      cursor: pointer;
    }

    .card-details {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .no-orders-msg {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 40px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
    }

    /* الشريط السفلي */
    .bottom-nav {
      position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; height: 73px;
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, 1fr); direction: rtl;
      background: rgba(2, 4, 9, .94); border-top: 1px solid rgba(244, 201, 93, .13);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    @media (min-width: 600px) {
      .bottom-nav { left: 50%; right: auto; width: min(100%, 520px); transform: translateX(-50%); border-radius: 20px 20px 0 0; }
    }
    .nav-item {
      text-decoration: none; color: #70798b; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; font-size: 9px; font-weight: 700;
    }
    .nav-item.active { color: #f5c85b; text-shadow: 0 0 10px rgba(244, 201, 93, .45); }
    .nav-icon-svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; opacity: 0.7; }
    .nav-item.active .nav-icon-svg { opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <a href="account.html" class="back-btn">›</a>
      <h1 class="header-title">سجل الطلبات</h1>
      <div style="width: 36px;"></div>
    </div>

    <div class="tabs-container">
      <button class="tab-btn active" data-filter="all">الجميع</button>
      <button class="tab-btn" data-filter="pending">للدفع</button>
      <button class="tab-btn" data-filter="completed">مكتمل</button>
      <button class="tab-btn" data-filter="cancelled">ملغى</button>
    </div>

    <div class="orders-list" id="history-cards-container">
      <div class="no-orders-msg">جاري تحديث حالات الطلبات من السيرفر... ⏳</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="HYPER_TOPUP_REVIEWS_PRO_FINAL-1.html">
      <svg class="nav-icon-svg" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>الرئيسية</span>
    </a>
    <a class="nav-item" href="all-products.html">
      <svg class="nav-icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>المنتجات</span>
    </a>
    <a class="nav-item active" href="account.html">
      <svg class="nav-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
      <span>الحساب</span>
    </a>
  </nav>

  <script>
    let allRenderedOrders = [];
    let currentFilter = 'all';

    // رابط API الخاص بـ SheetDB المرتبط بشيت جوجل الخاص بك
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/ouyhx87gxkpry';

    async function loadOrdersHistory() {
      const container = document.getElementById('history-cards-container');
      
      let savedOrders = localStorage.getItem('hyper_user_orders');
      if (!savedOrders) {
        container.innerHTML = `<div class="no-orders-msg">لم تقم بإجراء أي طلبات حتى الآن في المتجر 📋</div>`;
        return;
      }
      
      savedOrders = JSON.parse(savedOrders);
      
      let liveData = [];
      try {
        // جلب البيانات مع منع الكاش لضمان تحديث الحالات فور تعديلها في الشيت
        const response = await fetch(`${SHEETDB_URL}?timestamp=${Date.now()}`);
        if (response.ok) {
          liveData = await response.json();
        }
      } catch (err) {
        console.error("فشل جلب الحالات المحدثة:", err);
      }

      allRenderedOrders = savedOrders.reverse().map(order => {
        const liveOrder = liveData.find(item => item.OrderID === order.orderID);
        const currentStatus = liveOrder ? liveOrder.Status : (order.status || 'قيد المراجعة');

        let formattedDate = order.date || '';

if (formattedDate) {
  try {
    let d = new Date(formattedDate);
    if (!isNaN(d.getTime())) {
      // إجبار التنسيق بالإنجليزية وتحويل الأرقام لإنجليزية
      formattedDate = d.toLocaleString('en-US', {
        year: 'numeric',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      });
    } else {
      // في حالة تحويل النص يدوي تحويل الأرقام و AM/PM للإنجليزية
      formattedDate = formattedDate.replace(/(\d{1,2}):(\d{2}):?(\d{2})?/, (match, h, m, s) => {
        let hrs = parseInt(h, 10);
        let ampm = hrs >= 12 ? 'PM' : 'AM';
        hrs = hrs % 12 || 12;
        let sec = s ? `:${s}` : '';
        return `${String(hrs).padStart(2, '0')}:${m}${sec} ${ampm}`;
      });
    }

    // تحويل أي أرقام أو حروف عربية تحولت بالخطأ إلى إنجليزية
    const arDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    for (let i = 0; i < 10; i++) {
      formattedDate = formattedDate.replace(new RegExp(arDigits[i], 'g'), i);
    }
    formattedDate = formattedDate.replace(/ص/g, 'AM').replace(/م/g, 'PM');

  } catch (e) {
    console.log(e);
  }
}

        const gameName = order.game ? (order.game.split('-')[0] ? order.game.split('-')[0].trim() : order.game) : 'غير محدد';
        const packageName = order.game ? (order.game.split('-')[1] ? order.game.split('-')[1].trim() : 'غير محددة') : 'غير محددة';

        return {
          ...order,
          gameName,
          packageName,
          formattedDate,
          currentStatus: currentStatus
        };
      });

      renderFilteredOrders();
    }

    function renderFilteredOrders() {
      const container = document.getElementById('history-cards-container');
      container.innerHTML = '';

      const filtered = allRenderedOrders.filter(order => {
        const st = (order.currentStatus || '').toLowerCase();
        if (currentFilter === 'all') return true;
        
        if (currentFilter === 'completed') {
          return st.includes('مكتمل') || st.includes('تم') || st.includes('شحن');
        }
        
        if (currentFilter === 'pending') {
          return st.includes('مراجعة') || st.includes('انتظار') || st.includes('غير') || st.includes('معلق') || st.includes('قيد');
        }
        
        if (currentFilter === 'cancelled') {
          return st.includes('مرفوض') || st.includes('ملغى') || st.includes('إلغاء');
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="no-orders-msg">لا توجد طلبات في هذه الفئة 📋</div>`;
        return;
      }

      filtered.forEach(order => {
        let badgeClass = '';
        const st = (order.currentStatus || '').toLowerCase();
        if (st.includes('مكتمل') || st.includes('تم') || st.includes('شحن')) {
          badgeClass = 'completed';
        } else if (st.includes('مرفوض') || st.includes('ملغى') || st.includes('إلغاء')) {
          badgeClass = 'cancelled';
        }

        container.innerHTML += `
          <div class="history-card">
            <div class="history-header">
              <span class="history-order-id">#${order.orderID}</span>
              <span class="history-date">${order.formattedDate}</span>
            </div>
            <div class="history-row">اللعبة: <b style="color:#fff">${order.gameName}</b></div>
            <div class="history-row" style="color:#f5c85b;">الباقة: <b>${order.packageName}</b></div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <div class="history-row" style="margin:0;">المبلغ: <b style="color:#f5c85b">${order.amount} ج.م</b></div>
              <span class="history-status-badge ${badgeClass}">${order.currentStatus}</span>
            </div>

            <div class="toggle-arrow" onclick="toggleCardDetails(this)">اضغط لعرض التفاصيل ▾</div>

            <div class="card-details">
              <div class="history-row">معرّف اللاعب ID: <b>${order.playerID || 'غير مدخل'}</b></div>
              <div class="history-row">طريقة الدفع: <b>${order.method || 'غير محدد'}</b></div>
              <div class="history-row">كود الخصم: <b>${order.coupon || 'لا يوجد'}</b></div>
            </div>
          </div>
        `;
      });
    }

    function toggleCardDetails(el) {
      const details = el.nextElementSibling;
      if (details.style.display === 'block') {
        details.style.display = 'none';
        el.textContent = 'اضغط لعرض التفاصيل ▾';
      } else {
        details.style.display = 'block';
        el.textContent = 'إخفاء التفاصيل ▴';
      }
    }

    // التبديل بين التبويبات
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-filter');
        renderFilteredOrders();
      });
    });
    // دالة لمزامنة حالة الطلبات تلقائياً مع Google Sheets عبر SheetDB
async function syncOrdersWithSheet() {
  const sheetDbUrl = 'https://sheetdb.io/api/v1/ouyhx87gxkpry';
  let localOrders = JSON.parse(localStorage.getItem('hyper_user_orders') || '[]');

  if (localOrders.length === 0) return;

  try {
    const res = await fetch(sheetDbUrl);
    const sheetData = await res.json();

    if (Array.isArray(sheetData)) {
      let updated = false;

      localOrders.forEach(order => {
        // البحث عن الطلب في الشيت عن طريق تطابق OrderID
        const match = sheetData.find(item => 
          item.OrderID && item.OrderID.replace('#', '') === order.orderID.replace('#', '')
        );

        // إذا تم تغيير الحالة في الشيت، نقوم بتحديثها في الجهاز
        if (match && match.Status && match.Status !== order.status) {
          order.status = match.Status;
          updated = true;
        }
      });

      // حفظ التحديثات وإعادة عرض القائمة بالحالة الجديدة
      if (updated) {
        localStorage.setItem('hyper_user_orders', JSON.stringify(localOrders));
        if (typeof renderOrdersList === 'function') {
          renderOrdersList();
        } else if (typeof loadOrdersHistory === 'function') {
          loadOrdersHistory();
        } else {
          location.reload();
        }
      }
    }
  } catch (err) {
    console.error('فشل جلب تحديثات الشيت:', err);
  }
}

    // التشغيل التلقائي مع عمل جلب مستمر كل 10 ثوانٍ
    document.addEventListener('DOMContentLoaded', () => {
  loadOrdersHistory();
  syncOrdersWithSheet(); // تشغيل المزامنة أول ما الصفحة تفتح
  setInterval(syncOrdersWithSheet, 10000); // إعادتها كل 10 ثواني تلقائياً
});
  </script>
</body>
</html>
