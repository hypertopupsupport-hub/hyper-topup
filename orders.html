<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b17">
<meta name="robots" content="noindex">
<title>HYPER TOPUP | طلباتي</title>
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b17;--card:rgba(15,23,42,.74);--line:rgba(245,200,91,.22);--gold:#f5c85b;--gold2:#ffe49a;--gold3:#c9922c;--mute:#8b97ad;--ok:#34d399;--warn:#fbbf24;--red:#f87171;--f:'Cairo',Tahoma,Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#fff;font:500 15px/1.7 var(--f);padding:env(safe-area-inset-top) 0 24px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 38% at 50% -4%,rgba(245,200,91,.16),transparent),radial-gradient(45% 30% at 100% 35%,rgba(37,99,235,.14),transparent)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 20%,#000 15%,transparent 70%)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}
.ic{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{width:min(100%,480px);margin:0 auto;padding:12px 16px 0}

.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 18px}
.top h1{margin:0;font-size:1.3rem;font-weight:900}
.rnd{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(245,200,91,.08);color:var(--gold2);cursor:pointer;transition:transform .2s}
.rnd:active{transform:scale(.92)}
.rnd .ic{width:20px;height:20px}
.rnd.spin .ic{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* summary */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.st{padding:13px 8px;text-align:center;border-radius:20px;background:var(--card);border:1px solid var(--line);animation:up .6s var(--ease) both}
.st:nth-child(2){animation-delay:.06s}.st:nth-child(3){animation-delay:.12s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.st b{display:block;font:900 1.5rem/1.2 'Orbitron',var(--f);color:var(--gold2)}
.st span{font-size:.74rem;color:var(--mute);font-weight:700}
.st.ok b{color:var(--ok)}.st.wn b{color:var(--warn)}

/* tabs */
.tabs{display:flex;gap:8px;margin:0 -16px 14px;padding:2px 16px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:var(--card);color:var(--mute);font-weight:800;font-size:.82rem;cursor:pointer;transition:all .3s}
.tab i{font-style:normal;min-width:20px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.7rem;line-height:20px}
.tab.on{color:#1a1204;border-color:transparent;background:linear-gradient(135deg,var(--gold3),var(--gold2) 50%,var(--gold3));box-shadow:0 6px 20px rgba(245,200,91,.28)}
.tab.on i{background:rgba(26,18,4,.15)}
.note{margin:0 0 12px;padding:9px 14px;border-radius:12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:#fde68a;font-size:.8rem;font-weight:700}

/* order cards */
.list{display:grid;gap:12px}
.oc{position:relative;padding:16px 16px 12px;border-radius:22px;background:var(--card);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 30px rgba(0,0,0,.35);overflow:hidden;animation:up .55s var(--ease) both;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.oc::before{content:"";position:absolute;top:0;bottom:0;right:0;width:4px;background:var(--warn);box-shadow:0 0 16px var(--warn)}
.oc.completed::before{background:var(--ok);box-shadow:0 0 16px var(--ok)}
.oc.cancelled::before{background:var(--red);box-shadow:0 0 16px var(--red)}
.oh{display:flex;align-items:center;gap:12px}
.gi{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:15px;font:900 1.1rem var(--f);color:var(--gold2);background:linear-gradient(145deg,rgba(245,200,91,.2),rgba(245,200,91,.04));border:1px solid var(--line)}
.gm{flex:1;min-width:0}
.gm h3{margin:0;font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm p{margin:0;font-size:.82rem;color:var(--gold);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:left;font-weight:900;color:var(--gold2);font-size:1rem;white-space:nowrap}
.amt small{display:block;font-size:.66rem;color:var(--mute);font-weight:700}
.os{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.bd{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:.76rem;font-weight:800;background:rgba(251,191,36,.12);color:#fde68a;border:1px solid rgba(251,191,36,.35)}
.bd::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pl 1.8s infinite}
.completed .bd{background:rgba(52,211,153,.12);color:#a7f3d0;border-color:rgba(52,211,153,.4)}
.completed .bd::before,.cancelled .bd::before{animation:none}
.cancelled .bd{background:rgba(248,113,113,.12);color:#fecaca;border-color:rgba(248,113,113,.4)}
@keyframes pl{50%{opacity:.35}}
.dt{font-size:.74rem;color:var(--mute);direction:ltr}
.trk{display:flex;align-items:center;margin:14px 2px 4px}
.trk span{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;font-size:.66rem;color:var(--mute);font-weight:700;text-align:center;line-height:1.3}
.trk span::before{content:"";width:12px;height:12px;border-radius:50%;background:#1e293b;border:2px solid #334155}
.trk hr{flex:1;height:2px;margin:0 0 16px;border:0;background:#1e293b}
.trk .d{color:var(--gold2)}.trk .d::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(245,200,91,.6)}
.trk hr.d{background:var(--gold)}
.trk .a{color:var(--warn)}.trk .a::before{background:var(--warn);border-color:var(--warn);animation:pl 1.4s infinite}
.trk .g{color:#a7f3d0}.trk .g::before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px rgba(52,211,153,.6)}
.trk .x{color:#fecaca}.trk .x::before{background:var(--red);border-color:var(--red)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:8px;background:none;border:0;border-top:1px dashed rgba(255,255,255,.1);color:var(--mute);font-size:.78rem;font-weight:700;cursor:pointer}
.more .ic{width:16px;height:16px;transition:transform .3s}
.oc.open .more .ic{transform:rotate(180deg)}
.dw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.oc.open .dw{grid-template-rows:1fr}
.dw>div{overflow:hidden}
.dl{padding:6px 0 4px}
.dr{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.84rem}
.dr span{color:var(--mute)}
.dr b{font-weight:700;word-break:break-all;text-align:left;direction:ltr}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ab{display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(245,200,91,.08);color:var(--gold2);font:800 .8rem var(--f);cursor:pointer}
.ab:active{background:rgba(245,200,91,.18)}
.ab .ic{width:17px;height:17px}

/* empty */
.empty{padding:38px 20px;text-align:center;border-radius:24px;background:var(--card);border:1px dashed var(--line)}
.empty .ei{width:72px;height:72px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;color:var(--gold2);background:rgba(245,200,91,.08);border:1px solid var(--line)}
.empty .ei .ic{width:32px;height:32px}
.empty h2{margin:0 0 4px;font-size:1.1rem;font-weight:900}
.empty p{margin:0 0 16px;color:var(--mute);font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 24px;border-radius:14px;font:800 .92rem var(--f);color:#1a1204;background:linear-gradient(135deg,var(--gold3),var(--gold2) 50%,var(--gold3));box-shadow:0 8px 24px rgba(245,200,91,.28)}

#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;z-index:1000;padding:11px 20px;border-radius:14px;background:rgba(15,23,42,.94);border:1px solid rgba(52,211,153,.55);font-size:.84rem;font-weight:800;transform:translate(-50%,-140%);opacity:0;transition:transform .45s cubic-bezier(.34,1.4,.64,1),opacity .3s}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-back" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-rf" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></symbol>
<symbol id="i-dn" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-cp" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
<symbol id="i-hd" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
</svg>

<main class="wrap">
<header class="top">
<a class="rnd" href="account_1.html" aria-label="رجوع"><svg class="ic"><use href="#i-back"/></svg></a>
<h1>طلباتي</h1>
<button class="rnd" id="rf" type="button" aria-label="تحديث الحالات"><svg class="ic"><use href="#i-rf"/></svg></button>
</header>

<section class="sum" id="sum" hidden>
<div class="st"><b id="nAll">0</b><span>إجمالي الطلبات</span></div>
<div class="st ok"><b id="nDone">0</b><span>مكتملة</span></div>
<div class="st wn"><b id="nWait">0</b><span>قيد المراجعة</span></div>
</section>

<nav class="tabs" id="tabs" aria-label="تصفية الطلبات">
<button class="tab on" data-f="all" type="button">الجميع<i id="cAll">0</i></button>
<button class="tab" data-f="pending" type="button">قيد المراجعة<i id="cPend">0</i></button>
<button class="tab" data-f="completed" type="button">مكتمل<i id="cDone">0</i></button>
<button class="tab" data-f="cancelled" type="button">ملغى<i id="cCanc">0</i></button>
</nav>

<p class="note" id="note" hidden></p>
<div class="list" id="list" aria-live="polite"></div>
</main>

<div id="toast" role="status"></div>

<script>
(function () {
'use strict';
var SHEETDB_URL = 'https://sheetdb.io/api/v1/ouyhx87gxkpry';
var KEY = 'hyper_user_orders';
var POLL_MS = 45000;      // تحديث كل 45 ثانية فقط والصفحة ظاهرة
var MIN_GAP = 20000;      // أقل فاصل بين طلبين للسيرفر

var $ = function (id) { return document.getElementById(id); };
var LS = {
get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
var orders = [], filter = 'all', lastFetch = 0, busy = false;
var opened = {};

/* ---------- أدوات آمنة (بدون innerHTML) ---------- */
function h(tag, cls, text) {
var n = document.createElement(tag);
if (cls) n.className = cls;
if (text != null) n.textContent = text;
return n;
}
function icon(id) {
var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
s.setAttribute('class', 'ic');
var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
u.setAttribute('href', '#' + id);
s.appendChild(u);
return s;
}
var toastT;
function toast(msg) {
var t = $('toast'); t.textContent = msg; t.className = 'show';
clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, 2200);
}

/* ---------- البيانات ---------- */
function normId(v) { return String(v == null ? '' : v).replace('#', '').trim(); }
function readOrders() {
try { var a = JSON.parse(LS.get(KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function classify(st) {
var s = String(st || '').trim();
if (/(مرفوض|ملغ|إلغاء|الغاء|فشل|رفض)/.test(s)) return 'cancelled';
if (/(غير\s*مكتمل|جاري|قيد|انتظار|مراجعة|معلق)/.test(s)) return 'pending';
if (/(مكتمل|شحن|تنفيذ|تسليم|ناجح|(^|\s)تم(ت)?(\s|$))/.test(s)) return 'completed';
return 'pending';
}
function fmtDate(v) {
if (!v) return '';
var d = new Date(v);
if (isNaN(d.getTime())) return String(v);
return d.toLocaleString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
}
function splitGame(g) {
if (!g) return ['غير محدد', 'غير محددة'];
var s = String(g), i = s.search(/\s[-–—]\s/);
if (i < 0) i = s.indexOf('-');
if (i < 0) return [s.trim(), 'غير محددة'];
var m = s.slice(i).match(/^\s*[-–—]\s*/);
return [s.slice(0, i).trim() || 'غير محدد', s.slice(i + m[0].length).trim() || 'غير محددة'];
}
function amountText(a) {
var s = String(a == null ? '' : a).trim();
if (!s) return '—';
return /^[\d.,]+$/.test(s) ? s + ' ج.م' : s;
}
function load() {
var raw = readOrders();
orders = raw.map(function (o, i) {
var g = splitGame(o.game);
var status = o.status || 'قيد المراجعة';
var ts = new Date(o.date).getTime();
return { id: normId(o.orderID), game: g[0], pack: g[1], amount: amountText(o.amount), date: fmtDate(o.date), ts: isNaN(ts) ? null : ts, idx: i,
status: status, kind: classify(status), player: o.playerID || 'غير مدخل', method: o.method || 'غير محدد', coupon: o.coupon || 'لا يوجد' };
}).sort(function (a, b) {
if (a.ts != null && b.ts != null && a.ts !== b.ts) return b.ts - a.ts;
return b.idx - a.idx;
});
render();
}

/* ---------- الرسم ---------- */
function tracker(kind) {
var d = h('div', 'trk');
var steps = ['تم الاستلام', kind === 'cancelled' ? 'ملغى' : 'قيد المراجعة', 'مكتمل'];
var cls = kind === 'completed' ? ['d', 'd', 'g'] : kind === 'cancelled' ? ['d', 'x', ''] : ['d', 'a', ''];
steps.forEach(function (t, i) {
d.appendChild(h('span', cls[i], t));
if (i < 2) d.appendChild(h('hr', (kind === 'completed' || (kind !== 'cancelled' && i === 0) || (kind === 'cancelled' && i === 0)) ? 'd' : ''));
});
return d;
}
function row(k, v) { var r = h('div', 'dr'); r.appendChild(h('span', '', k)); r.appendChild(h('b', '', v)); return r; }
function card(o, i) {
var c = h('article', 'oc ' + o.kind + (opened[o.id] ? ' open' : ''));
c.style.animationDelay = Math.min(i, 8) * 0.05 + 's';

var hd = h('div', 'oh');
hd.appendChild(h('div', 'gi', (o.game.trim().charAt(0) || '#').toUpperCase()));
var gm = h('div', 'gm'); gm.appendChild(h('h3', '', o.game)); gm.appendChild(h('p', '', o.pack)); hd.appendChild(gm);
var am = h('div', 'amt', o.amount); am.appendChild(h('small', '', '#' + o.id)); hd.appendChild(am);
c.appendChild(hd);

var os = h('div', 'os'); os.appendChild(h('span', 'bd', o.status)); os.appendChild(h('span', 'dt', o.date)); c.appendChild(os);
c.appendChild(tracker(o.kind));

var more = h('button', 'more'); more.type = 'button'; more.setAttribute('aria-expanded', opened[o.id] ? 'true' : 'false');
more.appendChild(h('span', '', 'تفاصيل الطلب')); more.appendChild(icon('i-dn')); c.appendChild(more);

var dw = h('div', 'dw'), inner = h('div'), dl = h('div', 'dl');
dl.appendChild(row('معرّف اللاعب (ID)', o.player));
dl.appendChild(row('طريقة الدفع', o.method));
dl.appendChild(row('كود الخصم', o.coupon));
inner.appendChild(dl);

var acts = h('div', 'acts');
var cp = h('button', 'ab'); cp.type = 'button'; cp.appendChild(icon('i-cp')); cp.appendChild(h('span', '', 'نسخ رقم الطلب'));
cp.addEventListener('click', function () {
var t = '#' + o.id;
if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('تم نسخ رقم الطلب'); }, function () { toast('تعذّر النسخ'); });
else toast('تعذّر النسخ');
});
var sp = h('a', 'ab'); sp.href = 'support.html'; sp.appendChild(icon('i-hd')); sp.appendChild(h('span', '', 'استفسار عن الطلب'));
acts.appendChild(cp); acts.appendChild(sp); inner.appendChild(acts);
dw.appendChild(inner); c.appendChild(dw);

more.addEventListener('click', function () {
var on = c.classList.toggle('open'); opened[o.id] = on;
more.setAttribute('aria-expanded', on ? 'true' : 'false');
});
return c;
}
function emptyBox(title, text, withBtn) {
var e = h('div', 'empty'), i = h('div', 'ei'); i.appendChild(icon('i-bag')); e.appendChild(i);
e.appendChild(h('h2', '', title)); e.appendChild(h('p', '', text));
if (withBtn) { var a = h('a', 'btn', 'تصفّح المنتجات'); a.href = 'all-products.html'; e.appendChild(a); }
return e;
}
function render() {
var cnt = { all: orders.length, pending: 0, completed: 0, cancelled: 0 };
orders.forEach(function (o) { cnt[o.kind]++; });
$('cAll').textContent = cnt.all; $('cPend').textContent = cnt.pending; $('cDone').textContent = cnt.completed; $('cCanc').textContent = cnt.cancelled;
$('nAll').textContent = cnt.all; $('nDone').textContent = cnt.completed; $('nWait').textContent = cnt.pending;
$('sum').hidden = cnt.all === 0;

var list = $('list'); list.textContent = '';
if (!cnt.all) { list.appendChild(emptyBox('لا توجد طلبات بعد', 'ابدأ أول طلب شحن وستظهر حالته هنا فور تنفيذه.', true)); return; }
var shown = orders.filter(function (o) { return filter === 'all' || o.kind === filter; });
if (!shown.length) { list.appendChild(emptyBox('لا توجد طلبات هنا', 'لا يوجد طلبات في هذه الفئة حالياً.', false)); return; }
shown.forEach(function (o, i) { list.appendChild(card(o, i)); });
}

/* ---------- المزامنة مع الشيت (طلب واحد مُنظَّم) ---------- */
function note(t) { var n = $('note'); n.textContent = t || ''; n.hidden = !t; }
function sync(force) {
if (busy) return;
if (!force && Date.now() - lastFetch < MIN_GAP) return;
var local = readOrders();
if (!local.length) return;
busy = true; $('rf').classList.add('spin');
var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
fetch(SHEETDB_URL + '?_=' + Date.now(), { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
.then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
.then(function (rows) {
if (!Array.isArray(rows)) throw new Error('bad');
var map = {};
rows.forEach(function (r) { if (r && r.OrderID && r.Status) map[normId(r.OrderID)] = String(r.Status); });
var changed = false;
local.forEach(function (o) {
var s = map[normId(o.orderID)];
if (s && s !== o.status) { o.status = s; changed = true; }
});
if (changed) LS.set(KEY, JSON.stringify(local));
lastFetch = Date.now(); note('');
load();
})
.catch(function () { note('تعذّر تحديث الحالات الآن، نعرض آخر حالة محفوظة.'); })
.then(function () { clearTimeout(to); busy = false; $('rf').classList.remove('spin'); });
}

/* ---------- الأحداث ---------- */
$('tabs').addEventListener('click', function (e) {
