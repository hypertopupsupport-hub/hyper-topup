<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>HYPER TOPUP - شحن وخدمات TikTok</title>

<style>
/* ================= HYPER TOPUP — TIKTOK NEON PINK EDITION ================= */
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Orbitron:wght@700;800;900&display=swap');

:root {
  --bg-dark: #050508;
  --card-bg: rgba(18, 18, 26, 0.75);
  --pink-neon: #ff0055;
  --pink-glow: #ff2a75;
  --pink-light: #ff80ab;
  --text-white: #ffffff;
  --text-muted: #8e8ea0;
  --border-pink: rgba(255, 0, 85, 0.35);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background-color: #000;
  font-family: 'Cairo', system-ui, sans-serif;
  color: var(--text-white);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

/* Modal Overlay Wrapper */
.modal-overlay {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(255, 0, 85, 0.12) 0%, rgba(0, 0, 0, 0.95) 100%);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  z-index: 9999;
  overflow-y: auto;
  padding: 12px 12px 30px;
}

.modal-container {
  width: min(100%, 480px);
  background: var(--bg-dark);
  border: 1px solid var(--border-pink);
  border-radius: 24px;
  padding: 18px 16px 24px;
  box-shadow: 0 0 35px rgba(255, 0, 85, 0.25), inset 0 0 15px rgba(255, 0, 85, 0.1);
  backdrop-filter: blur(16px);
  margin: auto;
  position: relative;
}

/* Custom Header Layout */
.modal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
}

.header-titles {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.brand-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 1px;
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
}

.sub-badge {
  background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(138, 43, 226, 0.3));
  border: 1px solid var(--border-pink);
  color: var(--pink-light);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 12px;
  border-radius: 8px;
  display: inline-block;
}

.back-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: rgba(255, 0, 85, 0.08);
  border: 1px solid var(--border-pink);
  color: var(--pink-light);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  font-weight: 800;
  transition: all 0.2s ease;
  box-shadow: 0 0 10px rgba(255, 0, 85, 0.15);
}

.back-btn:active {
  transform: scale(0.92);
  background: var(--pink-neon);
  color: #fff;
  box-shadow: 0 0 15px var(--pink-neon);
}

/* Compact Top Banner Image */
.hero-banner {
  width: 100%;
  max-height: 130px;
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 16px;
  border: 1px solid var(--border-pink);
  box-shadow: 0 0 18px rgba(255, 0, 85, 0.2);
}

.hero-banner img {
  width: 100%;
  height: 130px;
  display: block;
  object-fit: cover;
  object-position: center;
}

/* Products Grid */
.products-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.product-card {
  background: var(--card-bg);
  border: 1px solid var(--border-pink);
  border-radius: 18px;
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.2s ease;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}

.product-card:active {
  transform: translateY(-2px);
  border-color: var(--pink-neon);
  box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
}

.coin-icon {
  width: 48px;
  height: 48px;
  object-fit: contain;
  margin-bottom: 8px;
  filter: drop-shadow(0 0 8px rgba(255, 0, 85, 0.4));
}

.coin-amount {
  font-family: 'Orbitron', 'Cairo', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 2px;
}

.coin-price {
  font-size: 12px;
  font-weight: 800;
  color: var(--pink-light);
  margin-bottom: 10px;
  direction: ltr;
}

/* Charge Button */
.btn-charge {
  width: 100%;
  padding: 7px 0;
  border: 1px solid var(--border-pink);
  border-radius: 10px;
  background: rgba(255, 0, 85, 0.12);
  color: #fff;
  font-family: 'Cairo', sans-serif;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-charge:active {
  background: var(--pink-neon);
  box-shadow: 0 0 12px var(--pink-neon);
  border-color: #fff;
}

/* Custom Input Section */
.custom-section {
  margin-top: 16px;
  padding: 14px;
  background: var(--card-bg);
  border: 1px solid var(--border-pink);
  border-radius: 18px;
  box-shadow: 0 0 15px rgba(255, 0, 85, 0.08);
}

.custom-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--pink-light);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.min-badge {
  font-size: 10px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.05);
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid rgba(255, 0, 85, 0.2);
}

.input-wrapper {
  position: relative;
  margin-bottom: 10px;
}

.custom-input {
  width: 100%;
  height: 44px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--border-pink);
  border-radius: 12px;
  padding: 0 12px;
  color: #fff;
  font-family: 'Orbitron', 'Cairo', sans-serif;
  font-size: 14px;
  font-weight: 700;
  outline: none;
  transition: all 0.2s ease;
}

.custom-input:focus {
  border-color: var(--pink-neon);
  box-shadow: 0 0 12px rgba(255, 0, 85, 0.35);
}

.custom-input::placeholder {
  color: var(--text-muted);
  font-size: 11px;
  font-family: 'Cairo', sans-serif;
}

.price-display {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  background: rgba(255, 0, 85, 0.05);
  border-radius: 10px;
  border: 1px dashed var(--border-pink);
  margin-bottom: 10px;
}

.price-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 700;
}

.price-value {
  font-family: 'Orbitron', 'Cairo', sans-serif;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 0 8px var(--pink-glow);
}
</style>
</head>

<body>

<div class="modal-overlay" id="tiktokModal">
  <div class="modal-container">
    
    <!-- Top Header Layout -->
    <div class="modal-header">
      <button class="tiktok.html" onclick="closeModal()" title="إغلاق">&lt;</button>
      
      <div class="header-titles">
        <div class="brand-title">HYPER TOPUP</div>
        <div class="sub-badge">شحن وخدمات TikTok</div>
      </div>
    </div>

    <!-- Hero Banner Image (Resized & Compact) -->
    <div class="hero-banner">
      <img src="https://i.ibb.co/FbSMg2ZW/IMG-20260911-214638.png" alt="شحن وخدمات TikTok">
    </div>

    <!-- Products Grid -->
    <div class="products-grid">

      <!-- 30 Coins -->
      <div class="product-card">
        <img src="https://i.ibb.co/DDd8Grzt/1000131566.png" class="coin-icon" alt="عملات تيك توك">
        <div class="coin-amount">30 عملة</div>
        <div class="coin-price">25 ج.م</div>
        <button class="btn-charge" onclick="orderCoins('30 عملة', '25 ج.م')">شحن فوري</button>
      </div>

      <!-- 350 Coins -->
      <div class="product-card">
        <img src="https://i.ibb.co/DDd8Grzt/1000131566.png" class="coin-icon" alt="عملات تيك توك">
        <div class="coin-amount">350 عملة</div>
        <div class="coin-price">245 ج.م</div>
        <button class="btn-charge" onclick="orderCoins('350 عملة', '245 ج.م')">شحن فوري</button>
      </div>

      <!-- 700 Coins -->
      <div class="product-card">
        <img src="https://i.ibb.co/DDd8Grzt/1000131566.png" class="coin-icon" alt="عملات تيك توك">
        <div class="coin-amount">700 عملة</div>
        <div class="coin-price">475 ج.م</div>
        <button class="btn-charge" onclick="orderCoins('700 عملة', '475 ج.م')">شحن فوري</button>
      </div>

      <!-- 1,400 Coins -->
      <div class="product-card">
        <img src="https://i.ibb.co/DDd8Grzt/1000131566.png" class="coin-icon" alt="عملات تيك توك">
        <div class="coin-amount">1,400 عملة</div>
        <div class="coin-price">935 ج.م</div>
        <button class="btn-charge" onclick="orderCoins('1,400 عملة', '935 ج.م')">شحن فوري</button>
      </div>

      <!-- 3,500 Coins -->
      <div class="product-card">
        <img src="https://i.ibb.co/DDd8Grzt/1000131566.png" class="coin-icon" alt="عملات تيك توك">
        <div class="coin-amount">3,500 عملة</div>
        <div class="coin-price">2,295 ج.م</div>
        <button class="btn-charge" onclick="orderCoins('3,500 عملة', '2,295 ج.م')">شحن فوري</button>
      </div>

      <!-- 7,000 Coins -->
      <div class="product-card">
        <img src="https://i.ibb.co/DDd8Grzt/1000131566.png" class="coin-icon" alt="عملات تيك توك">
        <div class="coin-amount">7,000 عملة</div>
        <div class="coin-price">4,550 ج.م</div>
        <button class="btn-charge" onclick="orderCoins('7,000 عملة', '4,550 ج.م')">شحن فوري</button>
      </div>

    </div>

    <!-- Full-Width Card for 17,500 Coins -->
    <div class="product-card" style="margin-top: 12px;">
      <img src="https://i.ibb.co/DDd8Grzt/1000131566.png" class="coin-icon" alt="عملات تيك توك">
      <div class="coin-amount">17,500 عملة</div>
      <div class="coin-price">11,150 ج.م</div>
      <button class="btn-charge" onclick="orderCoins('17,500 عملة', '11,150 ج.م')">شحن فوري</button>
    </div>

    <!-- Custom Amount Calculation -->
    <div class="custom-section">
      <div class="custom-title">
        <span>شحن كمية مخصصة</span>
        <span class="min-badge">30 - 2,500,000 عملة</span>
      </div>
      <div class="input-wrapper">
        <input type="number" id="customInput" class="custom-input" placeholder="اكتب عدد العملات المطلوب..." min="30" max="2500000" oninput="if(this.value > 2500000) this.value = 2500000; calculatePrice();">
      </div>
      <div class="price-display">
        <span class="price-label">السعر الإجمالي:</span>
        <span class="price-value" id="customTotalPrice">0 ج.م</span>
      </div>
      <button class="btn-charge" style="padding: 10px 0; font-size: 12px;" onclick="orderCustomCoins()">شحن فوري</button>
    </div>

  </div>
</div>

<script>
// Live Custom Amount Price Calculation (0.65 EGP per coin with 30 coins minimum)
function calculatePrice() {
  const input = document.getElementById('customInput');
  const display = document.getElementById('customTotalPrice');
  const amount = parseFloat(input.value);

  if (!isNaN(amount) && amount >= 30) {
    const total = amount * 0.65;
    display.textContent = total.toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + ' ج.م';
  } else if (!isNaN(amount) && amount < 30) {
    display.textContent = 'أقل شحن 30 عملة';
  } else {
    display.textContent = '0 ج.م';
  }
}

// WhatsApp Order Handler for Standard Packages
function orderCoins(packageAmount, price) {
  const phone = "201002722164";
  const message = encodeURIComponent(`مرحباً، أريد شحن عملات تيك توك:\nالباقة: ${packageAmount}\nالسعر: ${price}\nمن متجر HYPER TOPUP`);
  window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${message}`, '_blank');
}

// WhatsApp Order Handler for Custom Amount
function orderCustomCoins() {
    const input = document.getElementById('customInput');
    const amount = parseFloat(input.value);

    if (isNaN(amount) || amount < 30 || amount > 2500000) {
        alert('تنبيه: الحد الأدنى للشحن هو 30 عملة، والحد الأقصى هو 2,500,000 عملة!');
        return;
    }

    const total = (amount * 0.65).toFixed(2);
    const phone = "201002722164";
    const message = encodeURIComponent(`مرحباً، أريد شحن كمية مخصصة من عملات تيك توك\nالكمية: ${amount} عملة\nالإجمالي: ${total} ج.م\nمن متجر HYPER TOPUP`);
    window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${message}`, '_blank');
}

// Close Modal / Go Back
function closeModal() {
  window.location.href = "apps.html";
}
</script>

</body>
</html>
