  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }
    body {
      background-color: #080d1a;
      color: #ffffff;
      padding: 15px 15px 90px;
      direction: rtl;
    }

    .account-container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* نظام التنبيهات */
    #customToast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      width: calc(100% - 40px);
      max-width: 400px;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
      color: #ffffff;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(245, 200, 91, 0.4);
    }
    #customToast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }
    #customToast.success {
      background: rgba(16, 185, 129, 0.95);
      border-color: #34d399;
    }
    #customToast.error {
      background: rgba(239, 68, 68, 0.95);
      border-color: #f87171;
    }

    /* الهيدر العلوي */
    .header {
      position: relative;
      text-align: center;
      margin-bottom: 20px;
      padding-top: 5px;
    }
    .header-title {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
    }
    .help-btn {
      position: absolute;
      top: 0;
      left: 0;
      background: rgba(244, 201, 93, 0.1);
      color: #f5c85b;
      border: 1px solid rgba(244, 201, 93, 0.3);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* كارت المستخدم */
    .user-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(244, 201, 93, 0.25);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .user-avatar-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 48px;
      height: 48px;
      background: rgba(244, 201, 93, 0.15);
      border: 1px solid rgba(244, 201, 93, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5c85b;
    }
    .user-avatar svg { width: 26px; height: 26px; }
    .user-info h3 { font-size: 16px; color: #f5c85b; margin-bottom: 3px; }
    .user-info p { font-size: 12px; color: #94a3b8; direction: ltr; text-align: right; }
    .arrow-left { color: #64748b; font-size: 18px; }

    /* قائمة الخيارات */
    .menu-list {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 25px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      text-decoration: none;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-right { display: flex; align-items: center; gap: 12px; }
    .menu-right .icon { width: 20px; height: 20px; color: #f5c85b; }
    .arrow { font-size: 18px; color: #64748b; }
    .logout { color: #ef4444; }
    .logout .icon { color: #ef4444; }

    /* السوشيال ميديا */
    .footer-social { text-align: center; margin-top: 15px; }
    .social-title { font-size: 12px; color: #94a3b8; margin-bottom: 2px; }
    .social-sub { font-size: 11px; color: #64748b; margin-bottom: 10px; }
    .social-icons { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
    .social-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      color: #fff; text-decoration: none; font-size: 12px; font-weight: bold;
    }
    .app-version { font-size: 11px; color: #475569; }

    /* المودال ونوافذ تسجيل الدخول */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #0f172a;
      border: 1px solid #f5c85b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 0 25px rgba(244, 201, 93, 0.25);
      position: relative;
    }
    .close-modal-btn {
      position: absolute;
      top: 10px;
      left: 15px;
      font-size: 26px;
      font-weight: bold;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }
    .close-modal-btn:hover {
      color: #f5c85b;
    }

    /* الشريط السفلي الثابت */
    .bottom-nav {
      position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; height: 73px;
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: repeat(3, 1fr); direction: rtl;
      background: rgba(2, 4, 9, .94); border-top: 1px solid rgba(244, 201, 93, .13);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    @media (min-width: 600px) {
      .bottom-nav { left: 50%; right: auto; width: min(100%, 520px); transform: translateX(-50%); border-radius: 20px 20px 0 0; }
    }
    .nav-item {
      text-decoration: none; color: #70798b; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; font-size: 9px; font-weight: 700;
    }
    .nav-item.active { color: #f5c85b; text-shadow: 0 0 10px rgba(244, 201, 93, .45); }
    .nav-icon-svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; opacity: 0.7; }
    .nav-item.active .nav-icon-svg { opacity: 1; }
  </style>

      toast.textContent = message;

    window.openAuthModal = function() {

    };

    window.closeAuthModal = function() {
      const modal = document.getElementById('authModal');
      if (modal) modal.classList.remove('show');
    };

      if (modal) modal.classList.add('show');
    };

    window.closeLogoutModal = function() {
      const modal = document.getElementById('logoutConfirmModal');
      if (modal) modal.classList.remove('show');
    };

    window.toggleAuthMode = function() {
      isSignUpMode = !isSignUpMode;
      
      const modalTitle = document.getElementById('modalTitle');
      const authSubmitBtn = document.getElementById('authSubmitBtn');
      const nameFieldGroup = document.getElementById('nameFieldGroup');
      const toggleText = document.getElementById('toggleText');
      const toggleLink = document.getElementById('toggleLink');

      if (isSignUpMode) {
        if (modalTitle) modalTitle.textContent = 'إنشاء حساب جديد';
        if (authSubmitBtn) authSubmitBtn.textContent = 'إنشاء الحساب';
        if (nameFieldGroup) nameFieldGroup.style.display = 'block';
        if (toggleText) toggleText.textContent = 'لديك حساب بالفعل؟';
        if (toggleLink) toggleLink.textContent = 'تسجيل الدخول';
      } else {
        if (modalTitle) modalTitle.textContent = 'تسجيل الدخول';
        if (authSubmitBtn) authSubmitBtn.textContent = 'تسجيل الدخول';
        if (nameFieldGroup) nameFieldGroup.style.display = 'none';
        if (toggleText) toggleText.textContent = 'ليس لديك حساب؟';
        if (toggleLink) toggleLink.textContent = 'إنشاء حساب جديد';
      }
    };

    window.handleAuthSubmit = async function(event) {
      event.preventDefault();

      const emailInput = document.getElementById('authEmail');
      const passwordInput = document.getElementById('authPassword');
      const firstNameInput = document.getElementById('authFirstName');
      const lastNameInput = document.getElementById('authLastName');

      const email = emailInput ? emailInput.value.trim() : '';
      const password = passwordInput ? passwordInput.value.trim() : '';
      const firstName = firstNameInput ? firstNameInput.value.trim() : '';
      const lastName = lastNameInput ? lastNameInput.value.trim() : '';

      if (!email || !password) {
        showToast("يرجى ملء جميع الحقول", "error");
        return;
      }

      try {
        if (isSignUpMode) {
          if (!firstName || !lastName) {
            showToast("يرجى إدخال الاسم الأول والاسم الأخير", "error");
            return;
          }
          const fullName = `${firstName} ${lastName}`;
          const res = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(res.user, { displayName: fullName });
          showToast("تم إنشاء الحساب بنجاح!", "success");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          showToast("تم تسجيل الدخول بنجاح!", "success");
        }
        window.closeAuthModal();
      } catch (error) {
        let msg = "حدث خطأ ما، حاول مرة أخرى";
        if (error.code === 'auth/email-already-in-use') msg = "البريد الإلكتروني مستخدم بالفعل";
                else if (error.code === 'auth/weak-password') msg = "كلمة السر ضعيفة (6 أحرف على الأقل)";
        else if (error.code === 'auth/invalid-credential') msg = "البريد أو كلمة السر غير صحيحة";
        showToast(msg, "error");
      }
    };

    window.confirmLogout = async function() {
      localStorage.removeItem('hyper_user');
      localStorage.removeItem('hyper_user_logged');
      localStorage.removeItem('hyper_user_email');
      localStorage.removeItem('hyper_user_name');

      if (auth.currentUser) {
        await signOut(auth);
      }

      window.closeLogoutModal();
      showToast("تم تسجيل الخروج بنجاح", "success");
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    };

    // الإغلاق عند الضغط خارج المودال
    const authModal = document.getElementById('authModal');
    if (authModal) {
      authModal.onclick = (e) => {
        if (e.target === authModal) window.closeAuthModal();
      };
    }

    const logoutConfirmModal = document.getElementById('logoutConfirmModal');
    if (logoutConfirmModal) {
      logoutConfirmModal.onclick = (e) => {
        if (e.target === logoutConfirmModal) window.closeLogoutModal();
      };
    }

    // متابعة حالة المستخدم
    onAuthStateChanged(auth, (user) => {
      const nameEl = document.getElementById('displayUserName');
      const emailEl = document.getElementById('displayUserEmail');

      if (user) {
        const userData = {
          name: user.displayName || "مستخدم هايبر",
          email: user.email
        };
        localStorage.setItem('hyper_user', JSON.stringify(userData));

        if (nameEl) nameEl.textContent = user.displayName || "أهلاً بك 👋";
        if (emailEl) {
          emailEl.textContent = user.email;
          emailEl.style.display = 'block';
        }
      } else {
        localStorage.removeItem('hyper_user');

        if (nameEl) nameEl.textContent = "تسجيل الدخول / حساب جديد";
        if (emailEl) {
          emailEl.textContent = "";
          emailEl.style.display = 'none';
        }
      }
    });

    // فتح نافذة تأكيد الخروج عند الضغط على زر الخروج
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.onclick = () => {
        if (auth.currentUser) {
          window.openLogoutModal();
        } else {
          showToast("أنت غير مسجل دخول بالفعل", "error");
        }
      };
    }
window.handleGoogleSignIn = async function() {
  const provider = new GoogleAuthProvider();
  
  // إجبار جوجل على عرض قائمة الحسابات المسجلة مباشرة
  provider.setCustomParameters({
    prompt: 'select_account'
  });

  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    
    showToast(`أهلاً بك ${user.displayName || ''}!`, "success");
    window.closeAuthModal();
  } catch (error) {
    console.error(error);
    showToast("حدث خطأ أثناء التسجيل بواسطة Google", "error");
  }
};
  </script>
